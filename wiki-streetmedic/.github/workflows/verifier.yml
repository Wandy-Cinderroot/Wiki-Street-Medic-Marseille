name: Vérifier les propositions
on:
  pull_request:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python outils/verifier.py
      - run: python outils/preparer.py --strict
        env:
          WIKI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - run: zensical build --clean
