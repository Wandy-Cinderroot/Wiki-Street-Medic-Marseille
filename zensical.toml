nav = [
    { "Soigner" = [
        "Soigner/index.md",
    ] },

    { "Reconnaître" = [
        "Reconnaître/index.md",
        { "Unités" = [
            "Reconnaître/Unités/index.md",
        ] },
        { "Armes de contact" = [
            "Reconnaître/Armes de contact/index.md",
        ] },
        { "Munitions" = [
            "Reconnaître/Munitions/index.md",
        ] },
        { "Lanceurs" = [
            "Reconnaître/Lanceurs/index.md",
        ] },
        { "Véhicules" = [
            "Reconnaître/Véhicules/index.md",
        ] },
    ] },

    { "Se protéger" = [
        "Se protéger/index.md",
    ] },

    { "S'organiser" = [
        "S'organiser/index.md",
    ] },

    { "Se former" = [
        "Se former/index.md",
